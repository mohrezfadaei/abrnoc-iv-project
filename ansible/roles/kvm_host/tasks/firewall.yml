---
- name: install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nftables

- name: enable nftables service
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: remove iptables if present
  ansible.builtin.apt:
    name:
      - iptables
    state: absent
    purge: true
  when: ansible_facts.packages['iptables'] is defined
