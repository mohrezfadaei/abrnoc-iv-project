---
- name: install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: enable chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: remove systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: false
    state: stopped
  failed_when: false
