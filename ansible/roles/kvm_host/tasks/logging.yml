---
- name: configure journald for persistent storage
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart journald

- name: create journal persistent directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present

- name: enable rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started

- name: configure logrotate for libvirt
  ansible.builtin.copy:
    content: |
      /var/log/libvirt/qemu/*.log {
          weekly
          missingok
          rotate 12
          compress
          delaycompress
          notifempty
          create 0644 libvirt-qemu libvirt-qemu
      }
    dest: /etc/logrotate.d/libvirt-qemu
    owner: root
    group: root
    mode: "0644"
